<header class="header">
  <div class="container header__inner">
    <a class="logo" href="./index.html" aria-label="Your Energy home">
      <img src="./images/icons/logo.svg" alt="Your Energy" width="132" height="24" />
    </a>

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list">
        <li>
          <a class="nav__link" href="./index.html" data-nav="home">Home</a>
        </li>
        <li>
          <a class="nav__link" href="./favorites.html" data-nav="favorites"
            >Favorites</a
          >
        </li>
      </ul>
    </nav>

    <ul class="social social--header">
      <li>
        <a
          class="social__link"
          href="https://www.facebook.com/goITclub/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <img src="./images/icons/facebook.svg" alt="" width="28" height="28" />
        </a>
      </li>
      <li>
        <a
          class="social__link"
          href="https://www.instagram.com/goitclub/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <img src="./images/icons/instagram.svg" alt="" width="28" height="28" />
        </a>
      </li>
      <li>
        <a
          class="social__link"
          href="https://www.youtube.com/c/GoIT"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube"
        >
          <img src="./images/icons/youtube.svg" alt="" width="28" height="28" />
        </a>
      </li>
    </ul>

    <button
      class="header__menu"
      type="button"
      data-menu-open
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Open menu"
    >
      <img src="./images/icons/menu.svg" alt="" width="32" height="32" />
    </button>
  </div>
</header>

<div
  class="mobile-menu"
  id="mobile-menu"
  data-mobile-menu
  aria-hidden="true"
>
  <div class="mobile-menu__top">
    <a class="logo" href="./index.html" aria-label="Your Energy home">
      <img
        src="./images/icons/logo-light.svg"
        alt="Your Energy"
        width="132"
        height="24"
      />
    </a>
    <button
      class="mobile-menu__close"
      type="button"
      data-menu-close
      aria-label="Close menu"
    >
      <img src="./images/icons/close-mobile.svg" alt="" width="32" height="32" />
    </button>
  </div>

  <nav class="mobile-menu__nav" aria-label="Mobile">
    <ul class="mobile-menu__list">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./favorites.html">Favorites</a></li>
    </ul>
  </nav>

  <ul class="social social--mobile">
    <li>
      <a
        class="social__link"
        href="https://www.facebook.com/goITclub/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
      >
        <img
          src="./images/icons/facebook-light.svg"
          alt=""
          width="28"
          height="28"
        />
      </a>
    </li>
    <li>
      <a
        class="social__link"
        href="https://www.instagram.com/goitclub/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img
          src="./images/icons/instagram-light.svg"
          alt=""
          width="28"
          height="28"
        />
      </a>
    </li>
    <li>
      <a
        class="social__link"
        href="https://www.youtube.com/c/GoIT"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
      >
        <img
          src="./images/icons/youtube-light.svg"
          alt=""
          width="28"
          height="28"
        />
      </a>
    </li>
  </ul>
</div>
